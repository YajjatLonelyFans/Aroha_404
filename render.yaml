# Render blueprint for the Aroha API (backend/). The frontend is deployed on Vercel.
# Values marked `sync: false` are secrets or per-deploy values: Render asks for them when the
# blueprint is created, and they never live in git. Everything else is in .env.example.
services:
  - type: web
    name: aroha-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore # closest Render region to Delhi
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: APP_ENV
        value: production
      # The Vercel site, e.g. https://aroha.vercel.app (comma-separate several; no trailing slash)
      - key: CORS_ORIGINS
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: aroha_db
      - key: NOMINATIM_USER_AGENT
        sync: false
      - key: MEKO_API_KEY
        sync: false
      - key: MEKO_DATAPACK
        value: aroha
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: MAP_TILES_PROVIDER
        value: maptiler
      - key: MAPTILER_API_KEY
        sync: false
